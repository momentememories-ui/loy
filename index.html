<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>สุขสันต์วันลอยกระทงคนสวย</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #0b132b;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* โครงสร้างหน้าจอมือถือแนวตั้ง */
        .mobile-container {
            width: 100%;
            max-width: 430px;
            height: 100%;
            max-height: 932px;
            background: #0d1b2a url('พื้นหลัง.png') no-repeat center center;
            background-size: cover;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* พื้นที่น้ำ 70% ด้านล่าง */
        .water-section {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70%;
            overflow: hidden;
            pointer-events: auto;
            background: linear-gradient(to bottom, rgba(13, 27, 42, 0.2), rgba(27, 38, 59, 0.6));
        }

        /* ส่วนหัว UI คะแนน */
        .ui-header {
            position: absolute;
            top: 25px;
            width: 100%;
            text-align: center;
            z-index: 10;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
        }

        .ui-header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #ffeb3b;
        }

        .ui-header p {
            font-size: 0.95rem;
            background: rgba(0, 0, 0, 0.6);
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* กระทงเล็กที่ลอยจากซ้ายไปขวา */
        .floating-krathong {
            position: absolute;
            width: 70px;
            height: 70px;
            background-image: url('กระทง.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            transform: translate(-50%, -50%);
            z-index: 5;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.4));
        }

        /* หากยังไม่มีรูป ให้แสดงวงกลมจำลองชั่วคราวเพื่อให้เห็นกระทง */
        .floating-krathong.no-image {
            background: radial-gradient(circle, #ff9800, #d84315);
            border-radius: 50%;
            border: 3px solid #ffeb3b;
        }

        /* กระทงใหญ่ตรงกลาง */
        .giant-krathong-container {
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            display: none;
            animation: bounceIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bounceIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .giant-krathong {
            width: 260px;
            height: 260px;
            background-image: url('กระทง.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
            margin: 0 auto;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
        }

        .giant-krathong.no-image {
            background: radial-gradient(circle, #ffa726, #e65100);
            border-radius: 50%;
            border: 5px solid #ffeb3b;
        }

        /* เครื่องหมายคำถามบนกระทงใหญ่ */
        .question-mark {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            animation: pulse 1.2s infinite ease-in-out;
            cursor: pointer;
            z-index: 25;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.15); }
        }

        /* รูปคู่บนกระทงใหญ่ (ขยายใหญ่ขึ้น ไม่มีกรอบวงกลม) */
        .couple-photo {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            display: none;
            cursor: pointer;
            z-index: 25;
            border: 3px solid rgba(255,255,255,0.9);
            animation: popUpPhoto 0.8s ease forwards;
        }

        @keyframes popUpPhoto {
            0% { transform: translate(-50%, -50%) scale(0); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* หน้าต่าง Modal จิ๊กซอว์ */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 19, 43, 0.85);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .puzzle-box {
            background: linear-gradient(135deg, #ffffff, #fff3e0);
            padding: 20px;
            border-radius: 24px;
            text-align: center;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 3px solid #ffb74d;
        }

        .puzzle-box h2 {
            font-size: 1.2rem;
            color: #d84315;
            margin-bottom: 5px;
        }

        .puzzle-box p {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 15px;
        }

        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            width: 300px;
            height: 300px;
            margin: 0 auto 15px auto;
            background: #ffe0b2;
            padding: 4px;
            border-radius: 12px;
            border: 2px solid #ff9800;
        }

        .puzzle-piece {
            width: 96px;
            height: 96px;
            background-image: url('photo1.jpg');
            background-size: 288px 288px;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .puzzle-piece.selected {
            border: 3px dashed #d84315;
            transform: scale(0.95);
        }

        /* เอฟเฟกต์โคมลอยฉลอง */
        .celebration-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 90;
            display: none;
            overflow: hidden;
        }

        .floating-lantern {
            position: absolute;
            width: 35px;
            height: 55px;
            background: rgba(255, 152, 0, 0.9);
            border-radius: 20px 20px 10px 10px;
            animation: flyUpLantern 4s linear infinite;
            box-shadow: 0 0 15px #ff9800;
        }

        @keyframes flyUpLantern {
            0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
        }

        /* กล่องข้อความอธิษฐานตรงกลางจอ */
        .wish-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 150;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .wish-box-center {
            background: linear-gradient(135deg, #ffffff, #fff8e1);
            width: 90%;
            max-width: 360px;
            padding: 25px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            border: 4px solid #ffca28;
            transform: scale(0.8);
            animation: popUpWish 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popUpWish {
            to { transform: scale(1); }
        }

        .wish-box-center h3 {
            color: #e65100;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .wish-box-center p {
            color: #37474f;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            min-height: 80px;
        }

        .close-wish-btn {
            margin-top: 15px;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: #fff;
            border: none;
            padding: 8px 25px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(245,124,0,0.4);
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- ส่วนหัวคะแนน -->
        <div class="ui-header" id="uiHeader">
            <h1>🌕 ลอยกระทงกับคนดี 🌸</h1>
            <p id="scoreText">เก็บกระทง: 0 / 20</p>
        </div>

        <!-- แม่น้ำ 70% ด้านล่าง -->
        <div class="water-section" id="waterSection"></div>

        <!-- กระทงใหญ่ตอนเก็บครบ -->
        <div class="giant-krathong-container" id="giantContainer">
            <div class="giant-krathong" id="giantKrathong">
                <img src="nong.png" alt="Question" class="question-mark" id="questionMark" onerror="this.style.background='#ffeb3b';this.style.borderRadius='50%';">
                <img src="photo.png" alt="Couple Photo" class="couple-photo" id="couplePhoto">
            </div>
        </div>

        <!-- หน้าต่างจิ๊กซอว์ -->
        <div class="modal-overlay" id="puzzleModal">
            <div class="puzzle-box">
                <h2>🧩 ต่อจิ๊กซอว์สื่อรัก</h2>
                <p>สลับชิ้นส่วนภาพให้ถูกต้องเพื่อเปิดกระทงเซอร์ไพรส์!</p>
                <div class="puzzle-grid" id="puzzleGrid"></div>
            </div>
        </div>

        <!-- โคมลอยฉลอง -->
        <div class="celebration-overlay" id="celebrationOverlay"></div>

        <!-- กล่องข้อความอธิษฐาน -->
        <div class="wish-modal" id="wishModal">
            <div class="wish-box-center">
                <h3>✨ คำอธิษฐานในคืนวันลอยกระทง ✨</h3>
                <p id="typedText"></p>
                <button class="close-wish-btn" onclick="closeWishModal()">ปิด</button>
            </div>
        </div>
    </div>

    <script>
        let score = 0;
        const targetScore = 20;
        const waterSection = document.getElementById('waterSection');
        const scoreText = document.getElementById('scoreText');
        const uiHeader = document.getElementById('uiHeader');
        const giantContainer = document.getElementById('giantContainer');
        const questionMark = document.getElementById('questionMark');
        const couplePhoto = document.getElementById('couplePhoto');
        const puzzleModal = document.getElementById('puzzleModal');
        const celebrationOverlay = document.getElementById('celebrationOverlay');
        const wishModal = document.getElementById('wishModal');
        const typedText = document.getElementById('typedText');

        let spawnInterval;

        // 1. สร้างกระทงลอยจากซ้ายไปขวา
        function spawnKrathong() {
            if (score >= targetScore) return;

            const krathong = document.createElement('div');
            krathong.classList.add('floating-krathong');
            
            // เช็คว่าโหลดรูปกระทง.png ได้ไหม ถ้าไม่ได้ให้ใส่คลาสสำรอง
            const testImg = new Image();
            testImg.src = 'กระทง.png';
            testImg.onerror = () => krathong.classList.add('no-image');

            const randomY = Math.random() * (waterSection.clientHeight - 80);
            krathong.style.top = randomY + 'px';
            krathong.style.left = '-70px';

            waterSection.appendChild(krathong);

            let currentLeft = -70;
            const speed = 2.0 + Math.random() * 1.5; 
            
            const moveInterval = setInterval(() => {
                currentLeft += speed;
                krathong.style.left = currentLeft + 'px';

                if (currentLeft > waterSection.clientWidth + 70) {
                    clearInterval(moveInterval);
                    krathong.remove();
                }
            }, 25);

            krathong.addEventListener('click', (e) => {
                e.stopPropagation();
                score++;
                scoreText.innerText = `เก็บกระทง: ${score} / ${targetScore}`;
                clearInterval(moveInterval);
                krathong.remove();

                if (score >= targetScore) {
                    endMinigame();
                }
            });
        }

        spawnInterval = setInterval(spawnKrathong, 700);

        function endMinigame() {
            clearInterval(spawnInterval);
            document.querySelectorAll('.floating-krathong').forEach(k => k.remove());
            uiHeader.style.display = 'none';
            giantContainer.style.display = 'block';

            // ตรวจสอบรูปกระทงใหญ่
            const testGiant = new Image();
            testGiant.src = 'กระทง.png';
            testGiant.onerror = () => document.getElementById('giantKrathong').classList.add('no-image');
        }

        // 2. เปิดเกมจิ๊กซอว์
        questionMark.addEventListener('click', () => {
            puzzleModal.style.display = 'flex';
            initPuzzle();
        });

        let puzzlePieces = [0, 1, 2, 3, 4, 5, 6, 7, 8];
        let currentOrder = [...puzzlePieces];
        let selectedIndex = null;

        function isSorted(arr) {
            return arr.every((val, i) => val === puzzlePieces[i]);
        }

        function initPuzzle() {
            do {
                currentOrder.sort(() => Math.random() - 0.5);
            } while (isSorted(currentOrder)); 
            renderPuzzle();
        }

        function renderPuzzle() {
            const grid = document.getElementById('puzzleGrid');
            grid.innerHTML = '';

            currentOrder.forEach((pieceIndex, currentIndex) => {
                const piece = document.createElement('div');
                piece.classList.add('puzzle-piece');
                
                const x = (pieceIndex % 3) * 96;
                const y = Math.floor(pieceIndex / 3) * 96;
                piece.style.backgroundPosition = `-${x}px -${y}px`;

                piece.addEventListener('click', () => {
                    if (selectedIndex === null) {
                        selectedIndex = currentIndex;
                        piece.classList.add('selected');
                    } else {
                        let temp = currentOrder[selectedIndex];
                        currentOrder[selectedIndex] = currentOrder[currentIndex];
                        currentOrder[currentIndex] = temp;
                        selectedIndex = null;
                        renderPuzzle();

                        if (isSorted(currentOrder)) {
                            setTimeout(() => {
                                puzzleModal.style.display = 'none';
                                triggerCelebration();
                                questionMark.style.display = 'none';
                                couplePhoto.style.display = 'block';
                            }, 350);
                        }
                    }
                });

                grid.appendChild(piece);
            });
        }

        // 3. โคมลอยฉลอง
        function triggerCelebration() {
            celebrationOverlay.style.display = 'block';
            for (let i = 0; i < 15; i++) {
                const lantern = document.createElement('div');
                lantern.classList.add('floating-lantern');
                lantern.style.left = Math.random() * 100 + '%';
                lantern.style.animationDuration = (3 + Math.random() * 2) + 's';
                lantern.style.animationDelay = (Math.random() * 1.5) + 's';
                celebrationOverlay.appendChild(lantern);
            }
        }

        // 4. แสดงคำอธิษฐาน
        const wishMessage = "สุขสันต์วันลอยกระทงนะคับคนดี ขอให้กระทงนี้และโคมลอยนี้ นำพาความสุข ความรัก และเรื่องราวดีๆ มาให้เราได้จับมืออยู่เคียงข้างกันแบบนี้ตลอดไป รักเธอที่สุดเลยนะ ❤️";
        let isTypingStarted = false;

        couplePhoto.addEventListener('click', () => {
            wishModal.style.display = 'flex';
            if (!isTypingStarted) {
                isTypingStarted = true;
                typeWriter(wishMessage, 0);
            }
        });

        function typeWriter(text, i) {
            if (i < text.length) {
                typedText.innerHTML += text.charAt(i);
                setTimeout(() => typeWriter(text, i + 1), 60);
            }
        }

        function closeWishModal() {
            wishModal.style.display = 'none';
        }
    </script>
</body>
</html>
