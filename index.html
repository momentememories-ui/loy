<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>สุขสันต์วันลอยกระทงคนสวย</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #0b132b;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* โครงสร้างหน้าจอมือถือแนวตั้ง */
        .mobile-container {
            width: 100%;
            max-width: 430px;
            height: 100%;
            max-height: 932px;
            background: url('พื้นหลัง.png') no-repeat center center;
            background-size: cover;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* พื้นที่น้ำ 70% ด้านล่าง ลอยจากซ้ายไปขวา */
        .water-section {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70%;
            overflow: hidden;
            pointer-events: auto;
        }

        /* ส่วนหัว UI คะแนน */
        .ui-header {
            position: absolute;
            top: 25px;
            width: 100%;
            text-align: center;
            z-index: 10;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
        }

        .ui-header h1 {
            font-size: 1.6rem;
            margin-bottom: 5px;
            color: #ffeb3b;
        }

        .ui-header p {
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.5);
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* กระทงเล็กที่ลอยจากซ้ายไปขวา (เพิ่มความเร็ว) */
        .floating-krathong {
            position: absolute;
            width: 65px;
            height: 65px;
            background: url('กระทง.png') no-repeat center center;
            background-size: contain;
            cursor: pointer;
            animation: floatRight linear infinite;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        @keyframes floatRight {
            0% {
                transform: translateX(0px) translateY(0px) scale(0.95);
            }
            50% {
                transform: translateX(0px) translateY(-10px) scale(1.05);
            }
            100% {
                transform: translateX(0px) translateY(0px) scale(0.95);
            }
        }

        /* กระทงใหญ่ตรงกลาง (ขนาดใหญ่ขึ้นสะใจ) */
        .giant-krathong-container {
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            display: none;
            animation: bounceIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bounceIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .giant-krathong {
            width: 280px;
            height: 280px;
            background: url('กระทง.png') no-repeat center center;
            background-size: contain;
            position: relative;
            margin: 0 auto;
        }

        /* เครื่องหมายคำถามบนกระทงใหญ่ (ขยับขึ้นข้างบนอีก) */
        .question-mark {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 75px;
            height: 75px;
            animation: pulse 1.2s infinite ease-in-out;
            cursor: pointer;
            z-index: 25;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.15); }
        }

        /* รูปคู่บนกระทงใหญ่ (ขยายใหญ่ขึ้นอีก 80% ไม่มีกรอบวงกลม) */
        .couple-photo {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            display: none;
            cursor: pointer;
            z-index: 25;
            border: 3px solid rgba(255,255,255,0.8);
            animation: popUpPhoto 0.8s ease forwards;
        }

        @keyframes popUpPhoto {
            0% { transform: translate(-50%, -50%) scale(0); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* หน้าต่าง Modal / เกมจิ๊กซอว์สไตล์วัยรุ่นทันสมัย */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 19, 43, 0.85);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .puzzle-box {
            background: linear-gradient(135deg, #ffffff, #fff3e0);
            padding: 20px;
            border-radius: 24px;
            text-align: center;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 3px solid #ffb74d;
        }

        .puzzle-box h2 {
            font-size: 1.3rem;
            color: #d84315;
            margin-bottom: 5px;
        }

        .puzzle-box p {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 15px;
        }

        /* ตารางจิ๊กซอว์ 3x3 แบบสัดส่วนสมบูรณ์ ไม่บีบรูป */
        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            width: 300px;
            height: 300px;
            margin: 0 auto 15px auto;
            background: #ffe0b2;
            padding: 4px;
            border-radius: 12px;
            border: 2px solid #ff9800;
        }

        .puzzle-piece {
            width: 96px;
            height: 96px;
            background-image: url('photo1.jpg');
            background-size: 288px 288px; /* ขนาดรวมภาพต้นฉบับ 3x 96px */
            cursor: grab;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .puzzle-piece:active {
            cursor: grabbing;
            transform: scale(0.96);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .puzzle-piece.selected {
            border: 3px dashed #d84315;
            transform: scale(0.95);
        }

        /* เอฟเฟกต์พลุและโคมลอยฉลอง */
        .celebration-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 90;
            display: none;
            overflow: hidden;
        }

        .floating-lantern {
            position: absolute;
            width: 40px;
            height: 60px;
            background: rgba(255, 152, 0, 0.85);
            border-radius: 20px 20px 10px 10px;
            animation: flyUpLantern 4s linear infinite;
            box-shadow: 0 0 15px #ff9800;
        }

        @keyframes flyUpLantern {
            0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
        }

        /* กล่องข้อความอธิษฐาน เด้งตรงกลางหน้าจอพร้อมทรานซิชั่น */
        .wish-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 150;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeInModal 0.3s ease forwards;
        }

        @keyframes fadeInModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .wish-box-center {
            background: linear-gradient(135deg, #ffffff, #fff8e1);
            width: 90%;
            max-width: 360px;
            padding: 25px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            border: 4px solid #ffca28;
            transform: scale(0.7);
            animation: popUpWish 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
        }

        @keyframes popUpWish {
            to { transform: scale(1); }
        }

        .wish-box-center h3 {
            color: #e65100;
            font-size: 1.3rem;
            margin-bottom: 12px;
        }

        .wish-box-center p {
            color: #37474f;
            font-size: 1rem;
            line-height: 1.6;
            white-space: pre-wrap;
            min-height: 80px;
        }

        .close-wish-btn {
            margin-top: 15px;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: #fff;
            border: none;
            padding: 8px 25px;
            border-radius: 20px;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(245,124,0,0.4);
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- ส่วนหัวบอกสถานะเกมเก็บกระทง -->
        <div class="ui-header" id="uiHeader">
            <h1>🌕 ลอยกระทงกับคนดี 🌸</h1>
            <p id="scoreText">เก็บกระทง: 0 / 20</p>
        </div>

        <!-- แม่น้ำ (พื้นที่ 70% ด้านล่าง) -->
        <div class="water-section" id="waterSection">
            <!-- กระทงลอยมาจะถูกสร้างด้วย JavaScript -->
        </div>

        <!-- กระทงใหญ่ที่จะโผล่มาเมื่อเก็บครบ 20 ชิ้น -->
        <div class="giant-krathong-container" id="giantContainer">
            <div class="giant-krathong" id="giantKrathong">
                <!-- เครื่องหมายคำถาม -->
                <img src="nong.png" alt="Question" class="question-mark" id="questionMark">
                <!-- รูปคู่ที่จะแสดงหลังต่อจิ๊กซอว์เสร็จ (ขยาย 80% ไม่มีกรอบวงกลม) -->
                <img src="photo.png" alt="Couple Photo" class="couple-photo" id="couplePhoto">
            </div>
        </div>

        <!-- หน้าต่างเล่นเกมจิ๊กซอว์ดีไซน์วัยรุ่น -->
        <div class="modal-overlay" id="puzzleModal">
            <div class="puzzle-box">
                <h2>🧩 ต่อจิ๊กซอว์สื่อรัก</h2>
                <p>สลับชิ้นส่วนภาพให้ถูกต้องเพื่อเปิดกระทงเซอร์ไพรส์!</p>
                <div class="puzzle-grid" id="puzzleGrid">
                    <!-- ชิ้นส่วนจิ๊กซอว์ -->
                </div>
            </div>
        </div>

        <!-- เอฟเฟกต์โคมลอยฉลอง -->
        <div class="celebration-overlay" id="celebrationOverlay"></div>

        <!-- กล่องข้อความอธิษฐานเด้งตรงกลางจอ -->
        <div class="wish-modal" id="wishModal">
            <div class="wish-box-center">
                <h3>✨ คำอธิษฐานในคืนวันลอยกระทง ✨</h3>
                <p id="typedText"></p>
                <button class="close-wish-btn" onclick="closeWishModal()">ปิด</button>
            </div>
        </div>
    </div>

        const targetScore = 20;
        const
