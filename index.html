<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>สุขสันต์วันลอยกระทงคนสวย</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #0b132b;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* โครงสร้างหน้าจอมือถือแนวตั้ง */
        .mobile-container {
            width: 100%;
            max-width: 430px;
            height: 100%;
            max-height: 932px;
            background: #0d1b2a url('พื้นหลัง.png') no-repeat center center;
            background-size: cover;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* พื้นที่น้ำ 70% ด้านล่าง */
        .water-section {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70%;
            overflow: hidden;
            pointer-events: auto;
            background: linear-gradient(to bottom, rgba(13, 27, 42, 0.1), rgba(27, 38, 59, 0.5));
        }

        /* ส่วนหัว UI คะแนน */
        .ui-header {
            position: absolute;
            top: 25px;
            width: 100%;
            text-align: center;
            z-index: 10;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
        }

        .ui-header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #ffeb3b;
        }

        .ui-header p {
            font-size: 0.95rem;
            background: rgba(0, 0, 0, 0.6);
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* กระทงเล็กที่ลอยจากซ้ายไปขวา */
        .floating-krathong {
            position: absolute;
            width: 70px;
            height: 70px;
            background-image: url('กระทง.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            transform: translate(-50%, -50%);
            z-index: 5;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.4));
        }

        .floating-krathong.no-image {
            background: radial-gradient(circle, #ff9800, #d84315);
            border-radius: 50%;
            border: 3px solid #ffeb3b;
        }

        /* กระทงใหญ่ตรงกลาง */
        .giant-krathong-container {
            position: absolute;
            top: 58%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            display: none;
            animation: bounceIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bounceIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .giant-krathong {
            width: 338px;
            height: 338px;
            background-image: url('กระทง.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
            margin: 0 auto;
            filter: drop-shadow(0 12px 20px rgba(0,0,0,0.6));
        }

        .giant-krathong.no-image {
            background: radial-gradient(circle, #ffa726, #e65100);
            border-radius: 50%;
            border: 6px solid #ffeb3b;
        }

        /* เครื่องหมายคำถามบนกระทงใหญ่ */
        .question-mark {
            position: absolute;
            top: 18%;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            animation: pulse 1.2s infinite ease-in-out;
            cursor: pointer;
            z-index: 25;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.15); }
        }

        /* รูปคู่บนกระทงใหญ่ (ขยับขึ้นไปอีก ไม่มีกรอบสี่เหลี่ยม) */
        .couple-photo {
            position: absolute;
            top: 32%; /* ขยับขึ้นไปอีก */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 50%; /* โค้งมนสวยงาม ไร้กรอบเหลี่ยมแข็งๆ */
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: none;
            cursor: pointer;
            z-index: 25;
            border: 4px solid rgba(255, 255, 255, 0.9);
            animation: enticingPulse 1.5s infinite ease-in-out;
        }

        @keyframes enticingPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.08); box-shadow: 0 0 25px rgba(255, 235, 59, 0.8); }
        }

        /* หน้าต่าง Modal จิ๊กซอว์โทนชมพูขาว ทันสมัย สไตล์วัยรุ่น */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 10, 25, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .puzzle-box {
            background: linear-gradient(135deg, #ffffff, #ffe4e1);
            padding: 22px;
            border-radius: 30px;
            text-align: center;
            width: 100%;
            max-width: 370px;
            box-shadow: 0 15px 40px rgba(255, 105, 180, 0.3);
            border: 4px solid #ffb6c1;
        }

        .puzzle-box h2 {
            font-size: 1.3rem;
            color: #d81b60;
            margin-bottom: 5px;
        }

        .puzzle-box p {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 15px;
        }

        /* พื้นที่ตารางจิ๊กซอว์ปรับขนาดตามต้นฉบับ ไม่บีบรูป */
        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            width: 312px;
            height: 312px;
            margin: 0 auto 15px auto;
            background: rgba(255, 182, 193, 0.3);
            padding: 6px;
            border-radius: 20px;
            border: 2px solid #ff69b4;
        }

        .puzzle-piece {
            width: 100px;
            height: 100px;
            background-image: url('photo1.jpg');
            background-size: 300px 300px; /* ขนาดต้นฉบับสัดส่วนจริง */
            cursor: grab;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .puzzle-piece:active {
            cursor: grabbing;
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .puzzle-piece.dragging {
            opacity: 0.4;
        }

        /* แสดงภาพเต็มเมื่อต่อจิ๊กซอว์เสร็จ */
        .completed-preview {
            width: 300px;
            height: 300px;
            background-image: url('photo1.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            margin: 0 auto 15px auto;
            border: 4px solid #ff69b4;
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.4);
            display: none;
        }

        /* พลุดอกไม้ไฟสมจริง แตกกระจายสวยงาม ค้างนานขึ้น */
        .fireworks-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 120;
            display: none;
            overflow: hidden;
        }

        .firework-particle {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            animation: explodeRealistic 2s ease-out forwards; /* ค้างนานขึ้นเป็น 2 วินาที */
        }

        @keyframes explodeRealistic {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0.2);
                opacity: 0;
            }
        }

        /* โคมลอยสมจริง ขนาดเล็ก ไม่เป็นจุดเด่นเกินไป (ไม่เหมือนขาไก่) */
        .realistic-lantern {
            position: absolute;
            width: 32px;
            height: 48px;
            background: radial-gradient(circle at 35% 35%, #fff59d, #ffb74d 70%, #f57c00);
            border-radius: 50% 50% 40% 40%;
            box-shadow: 0 0 12px #ff9800;
            animation: flyUpRealistic 6s linear infinite;
            z-index: 8;
            opacity: 0.75;
        }

        /* ไส้เทียน/เปลวไฟโคมลอย */
        .realistic-lantern::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px #fff, 0 0 12px #ff5722;
        }

        @keyframes flyUpRealistic {
            0% { transform: translateY(105vh) scale(0.6) rotate(-3deg); opacity: 0; }
            20% { opacity: 0.75; }
            80% { opacity: 0.75; }
            100% { transform: translateY(-100px) scale(1.1) rotate(3deg); opacity: 0; }
        }

        /* กล่องข้อความอธิษฐานตรงกลางจอ */
        .wish-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 150;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .wish-box-center {
            background: linear-gradient(135deg, #ffffff, #fff8e1);
            width: 90%;
            max-width: 360px;
            padding: 25px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            border: 4px solid #ffca28;
            transform: scale(0.8);
            animation: popUpWish 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popUpWish {
            to { transform: scale(1); }
        }

        .wish-box-center h3 {
            color: #e65100;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .wish-box-center p {
            color: #37474f;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            min-height: 80px;
        }

        .close-wish-btn {
            margin-top: 15px;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: #fff;
            border: none;
            padding: 8px 25px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(245,124,0,0.4);
        }

        /* ปุ่มเปิด/ปิดเพลงประกอบ */
        .music-btn {
            position: absolute;
            top: 25px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            z-index: 30;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <!-- ไฟล์เพลงประกอบ -->
    <audio id="bgMusic" src="song.mp3" loop></audio>

    <div class="mobile-container">
        <!-- ปุ่มควบคุมเสียงเพลง -->
        <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵 เปิดเพลง</button>

        <!-- ส่วนหัวคะแนน -->
        <div class="ui-header" id="uiHeader">
            <h1>🌕 ลอยกระทงกับคนดี 🌸</h1>
            <p id="scoreText">เก็บกระทง: 0 / 20</p>
        </div>

        <!-- แม่น้ำ 70% ด้านล่าง -->
        <div class="water-section" id="waterSection"></div>

        <!-- กระทงใหญ่ตอนเก็บครบ -->
        <div class="giant-krathong-container" id="giantContainer">
            <div class="giant-krathong" id="giantKrathong">
                <img src="nong.png" alt="Question" class="question-mark" id="questionMark" onerror="this.style.background='#ffeb3b';this.style.borderRadius='50%';">
                <img src="photo.png" alt="Couple Photo" class="couple-photo" id="couplePhoto">
            </div>
        </div>

        <!-- หน้าต่างจิ๊กซอว์โทนชมพูขาว ทันสมัย -->
        <div class="modal-overlay" id="puzzleModal">
            <div class="puzzle-box">
                <div id="puzzleContentArea">
                    <h2>🧩 ต่อจิ๊กซอว์สื่อรัก</h2>
                    <p>ลากชิ้นส่วนภาพสลับตำแหน่งกันให้ถูกต้องนะคับ ❤️</p>
                    <div class="puzzle-grid" id="puzzleGrid"></div>
                </div>
                <!-- ภาพเต็มเมื่อต่อสำเร็จ -->
                <div class="completed-preview" id="completedPreview"></div>
                <h3 id="successText" style="color: #d81b60; display: none; margin-top: 10px; font-weight: 600;">🎉 เก่งที่สุด! ต่อภาพสำเร็จแล้วเย้~ ✨</h3>
            </div>
        </div>

        <!-- พลุดอกไม้ไฟสมจริง -->
        <div class="fireworks-container" id="fireworksContainer"></div>

        <!-- โคมลอยสมจริงขนาดเล็กฉากหลัง -->
        <div class="celebration-overlay" id="celebrationOverlay" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:8; display:none; overflow:hidden;"></div>

        <!-- กล่องข้อความอธิษฐาน -->
        <div class="wish-modal" id="wishModal">
            <div class="wish-box-center">
                <h3>✨ คำอธิษฐานในคืนวันลอยกระทง ✨</h3>
                <p id="typedText"></p>
                <button class="close-wish-btn" onclick="closeWishModal()">ปิด</button>
            </div>
        </div>
    </div>

    <script>
        // ระบบควบคุมเสียงเพลง song.mp3
        const bgMusic = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        let isMusicPlaying = false;

        function toggleMusic() {
            if (!isMusicPlaying) {
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    musicBtn.innerText = "🔇 ปิดเพลง";
                }).catch(e => {
                    alert("กรุณาตรวจสอบไฟล์ song.mp3 ในโฟลเดอร์เดียวกันด้วยนะคับ");
                });
            } else {
                bgMusic.pause();
                isMusicPlaying = false;
                musicBtn.innerText = "🎵 เปิดเพลง";
            }
        }

        // ระบบเสียง Pop เอฟเฟกต์ตอนกดเก็บกระทง
        function playPopSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        let score = 0;
        const targetScore = 20;
        const waterSection = document.getElementById('waterSection');
        const scoreText = document.getElementById('scoreText');
        const uiHeader = document.getElementById('uiHeader');
        const giantContainer = document.getElementById('giantContainer');
        const questionMark = document.getElementById('questionMark');
        const couplePhoto = document.getElementById('couplePhoto');
        const puzzleModal = document.getElementById('puzzleModal');
        const fireworksContainer = document.getElementById('fireworksContainer');
        const celebrationOverlay = document.getElementById('celebrationOverlay');
        const wishModal = document.getElementById('wishModal');
        const typedText = document.getElementById('typedText');

        let spawnInterval;

        // 1. สร้างกระทงลอยจากซ้ายไปขวา
        function spawnKrathong() {
            if (score >= targetScore) return;

            const krathong = document.createElement('div');
            krathong.classList.add('floating-krathong');
            
            const testImg = new Image();
            testImg.src = 'กระทง.png';
            testImg.onerror = () => krathong.classList.add('no-image');

            const randomY = Math.random() * (waterSection.clientHeight - 80);
            krathong.style.top = randomY + 'px';
            krathong.style.left = '-70px';

            waterSection.appendChild(krathong);

            let currentLeft = -70;
            const speed = 2.0 + Math.random() * 1.5; 
            
            const moveInterval = setInterval(() => {
                currentLeft += speed;
                krathong.style.left = currentLeft + 'px';

                if (currentLeft > waterSection.clientWidth + 70) {
                    clearInterval(moveInterval);
                    krathong.remove();
                }
            }, 25);

            krathong.addEventListener('click', (e) => {
                e.stopPropagation();
                playPopSound();
                score++;
                scoreText.innerText = `เก็บกระทง: ${score} / ${targetScore}`;
                clearInterval(moveInterval);
                krathong.remove();

                if (score >= targetScore) {
                    endMinigame();
                }
            });
        }

        spawnInterval = setInterval(spawnKrathong, 650);

        function endMinigame() {
            clearInterval(spawnInterval);
            document.querySelectorAll('.floating-krathong').forEach(k => k.remove());
            uiHeader.style.display = 'none';
            giantContainer.style.display = 'block';

            const testGiant = new Image();
            testGiant.src = 'กระทง.png';
            testGiant.onerror = () => document.getElementById('giantKrathong').classList.add('no-image');
        }

        // 2. เปิดเกมจิ๊กซอว์
        questionMark.addEventListener('click', () => {
            puzzleModal.style.display = 'flex';
            document.getElementById('puzzleGrid').style.display = 'grid';
            document.getElementById('completedPreview').style.display = 'none';
            document.getElementById('successText').style.display = 'none';
            initPuzzle();
        });

        // 3. ระบบจิ๊กซอว์ตามขนาดต้นฉบับ ไม่บีบรูป ลากวางได้
        let puzzlePieces = [0, 1, 2, 3, 4, 5, 6, 7, 8];
        let currentOrder = [...puzzlePieces];
        let draggedIndex = null;

        function isSorted(arr) {
            return arr.every((val, i) => val === puzzlePieces[i]);
        }

        function initPuzzle() {
            do {
                currentOrder.sort(() => Math.random() - 0.5);
            } while (isSorted(currentOrder)); 
            renderPuzzle();
        }

        function renderPuzzle() {
            const grid = document.getElementById('puzzleGrid');
            grid.innerHTML = '';

            currentOrder.forEach((pieceIndex, currentIndex) => {
                const piece = document.createElement('div');
                piece.classList.add('puzzle-piece');
                piece.setAttribute('draggable', 'true');
                
                const x = (pieceIndex % 3) * 100;
                const y = Math.floor(pieceIndex / 3) * 100;
                piece.style.backgroundPosition = `-${x}px -${y}px`;
                piece.dataset.index = currentIndex;

                piece.addEventListener('dragstart', (e) => {
                    draggedIndex = currentIndex;
                    piece.classList.add('dragging');
                });

                piece.addEventListener('dragend', () => {
                    piece.classList.remove('dragging');
                });

                piece.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });

                piece.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const targetIndex = parseInt(piece.dataset.index);
                    if (draggedIndex !== null && draggedIndex !== targetIndex) {
                        let temp = currentOrder[draggedIndex];
                        currentOrder[draggedIndex] = currentOrder[targetIndex];
                        currentOrder[targetIndex] = temp;
                        renderPuzzle();

                        if (isSorted(currentOrder)) {
                            onPuzzleCompleted();
                        }
                    }
                });

                piece.addEventListener('click', () => {
                    if (draggedIndex === null) {
                        draggedIndex = currentIndex;
                        piece.style.border = '3px solid #ff1493';
                    } else {
                        let temp = currentOrder[draggedIndex];
                        currentOrder[draggedIndex] = currentOrder[currentIndex];
                        currentOrder[currentIndex] = temp;
                        draggedIndex = null;
                        renderPuzzle();

                        if (isSorted(currentOrder)) {
                            onPuzzleCompleted();
                        }
                    }
                });

                grid.appendChild(piece);
            });
        }

        function onPuzzleCompleted() {
            document.getElementById('puzzleGrid').style.display = 'none';
            document.getElementById('completedPreview').style.display = 'block';
            document.getElementById('successText').style.display = 'block';
            
            triggerRealisticFireworks();
            triggerRealisticLanterns();

            // ค้างหน้าจอแสดงความยินดีนานขึ้น (3.5 วินาที) ก่อนกลับหน้ากระทง
            setTimeout(() => {
                puzzleModal.style.display = 'none';
                questionMark.style.display = 'none';
                couplePhoto.style.display = 'block';
            }, 3500);
        }

        // พลุดอกไม้ไฟสมจริง แตกกระจายสวยงาม
        function triggerRealisticFireworks() {
            fireworksContainer.style.display = 'block';
            const colors = ['#ff69b4', '#ffeb3b', '#00ffff', '#ff4500', '#ba55d3'];
            
            for (let burst = 0; burst < 3; burst++) {
                setTimeout(() => {
                    const startX = 20 + Math.random() * 60;
                    const startY = 20 + Math.random() * 40;
                    const color = colors[Math.floor(Math.random() * colors.length)];

                    for (let i = 0; i < 35; i++) {
                        const particle = document.createElement('div');
                        particle.classList.add('firework-particle');
                        particle.style.left = startX + '%';
                        particle.style.top = startY + '%';
                        particle.style.backgroundColor = color;
                        particle.style.boxShadow = `0 0 8px ${color}`;

                        const angle = Math.random() * Math.PI * 2;
                        const distance = 60 + Math.random() * 100;
                        const tx = Math.cos(angle) * distance;
                        const ty = Math.sin(angle) * distance;

                        particle.style.setProperty('--tx', tx + 'px');
                        particle.style.setProperty('--ty', ty + 'px');

                        fireworksContainer.appendChild(particle);
                        setTimeout(() => particle.remove(), 2000);
                    }
                }, burst * 700);
            }

            setTimeout(() => { fireworksContainer.style.display = 'none'; fireworksContainer.innerHTML = ''; }, 4000);
        }

        // โคมลอยสมจริงขนาดเล็กฉากหลัง
        function triggerRealisticLanterns() {
            celebrationOverlay.style.display = 'block';
            for (let i = 0; i < 8; i++) {
                const lantern = document.createElement('div');
                lantern.classList.add('realistic-lantern');
                lantern.style.left = (10 + Math.random() * 80) + '%';
                lantern.style.animationDuration = (5 + Math.random() * 2) + 's';
                lantern.style.animationDelay = (Math.random() * 1.5) + 's';
                celebrationOverlay.appendChild(lantern);
            }
        }

        // 4. แสดงคำอธิษฐาน
        const wishMessage = "สุขสันต์วันลอยกระทงนะคับคนดี ขอให้กระทงนี้และโคมลอยนี้ นำพาความสุข ความรัก และเรื่องราวดีๆ มาให้เราได้จับมืออยู่เคียงข้างกันแบบนี้ตลอดไป รักเธอที่สุดเลยนะ ❤️";
        let isTypingStarted = false;

        couplePhoto.addEventListener('click', () => {
            wishModal.style.display = 'flex';
            if (!isTypingStarted) {
                isTypingStarted = true;
                typeWriter(wishMessage, 0);
            }
        });

        function typeWriter(text, i) {
            if (i < text.length) {
                typedText.innerHTML += text.charAt(i);
                setTimeout(() => typeWriter(text, i + 1), 60);
            }
        }

        function closeWishModal() {
            wishModal.style.display = 'none';
        }
    </script>
</body>
