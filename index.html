<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>สุขสันต์วันลอยกระทง</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #0b132b;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* โครงสร้างหน้าจอมือถือแนวตั้ง */
        .mobile-container {
            width: 100%;
            max-width: 430px;
            height: 100%;
            max-height: 932px;
            background: url('พื้นหลัง.png') no-repeat center center;
            background-size: cover;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* พื้นที่น้ำ 80% ด้านล่าง */
        .water-section {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80%;
            overflow: hidden;
            pointer-events: auto;
        }

        /* ส่วนหัว UI คะแนน */
        .ui-header {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
        }

        .ui-header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .ui-header p {
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.4);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* กระทงเล็กที่ลอยมาให้เก็บ */
        .floating-krathong {
            position: absolute;
            width: 70px;
            height: 70px;
            background: url('กระทง.png') no-repeat center center;
            background-size: contain;
            cursor: pointer;
            animation: floatUp 4s linear infinite;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0px) scale(0.9);
            }
            50% {
                transform: translateY(-15px) scale(1);
            }
            100% {
                transform: translateY(0px) scale(0.9);
            }
        }

        /* กระทงใหญ่ตรงกลาง */
        .giant-krathong-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            display: none;
            animation: bounceIn 1s ease forwards;
        }

        @keyframes bounceIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            70% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .giant-krathong {
            width: 220px;
            height: 220px;
            background: url('กระทง.png') no-repeat center center;
            background-size: contain;
            position: relative;
            margin: 0 auto;
            cursor: pointer;
        }

        /* เครื่องหมายคำถามบนกระทงใหญ่ */
        .question-mark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -70%);
            width: 60px;
            height: 60px;
            animation: pulse 1.5s infinite ease-in-out;
            cursor: pointer;
            z-index: 25;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -70%) scale(1); }
            50% { transform: translate(-50%, -70%) scale(1.15); }
            100% { transform: translate(-50%, -70%) scale(1); }
        }

        /* รูปคู่บนกระทงใหญ่หลังจากต่อจิ๊กซอว์เสร็จ */
        .couple-photo {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -60%);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffcc00;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: none;
            cursor: pointer;
            z-index: 25;
        }

        /* หน้าต่าง Modal / เกมจิ๊กซอว์ */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .puzzle-box {
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .puzzle-box h2 {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 10px;
        }

        /* ตารางจิ๊กซอว์ 3x3 */
        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            width: 270px;
            height: 270px;
            margin: 0 auto 15px auto;
            background: #ddd;
            border: 2px solid #333;
        }

        .puzzle-piece {
            width: 90px;
            height: 90px;
            background-image: url('photo1.jpg');
            background-size: 270px 270px;
            cursor: pointer;
            border: 1px solid #fff;
            transition: transform 0.2s;
        }

        .puzzle-piece:active {
            transform: scale(0.95);
        }

        /* กล่องแสดงข้อความอธิษฐาน */
        .wish-box {
            position: absolute;
            bottom: 30px;
            left: 5%, right: 5%;
            width: 90%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: none;
            z-index: 30;
            text-align: center;
        }

        .wish-box p {
            color: #2b2b2b;
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- ส่วนหัวบอกสถานะเกมเก็บกระทง -->
        <div class="ui-header" id="uiHeader">
            <h1>ลอยกระทงกับเธอ</h1>
            <p id="scoreText">เก็บกระทง: 0 / 20</p>
        </div>

        <!-- แม่น้ำ (พื้นที่ 80% ด้านล่าง) -->
        <div class="water-section" id="waterSection">
            <!-- กระทงลอยมาเรื่อยๆ จะถูกสร้างด้วย JavaScript -->
        </div>

        <!-- กระทงใหญ่ที่จะโผล่มาเมื่อเก็บครบ 20 ชิ้น -->
        <div class="giant-krathong-container" id="giantContainer">
            <div class="giant-krathong" id="giantKrathong">
                <!-- เครื่องหมายคำถาม -->
                <img src="nong.png" alt="Question" class="question-mark" id="questionMark">
                <!-- รูปคู่ที่จะแสดงหลังต่อจิ๊กซอว์เสร็จ -->
                <img src="photo.png" alt="Couple Photo" class="couple-photo" id="couplePhoto">
            </div>
        </div>

        <!-- กล่องข้อความอธิษฐาน ค่อยๆ พิมพ์ -->
        <div class="wish-box" id="wishBox">
            <p id="typedText"></p>
        </div>

        <!-- หน้าต่างเล่นเกมจิ๊กซอว์ -->
        <div class="modal-overlay" id="puzzleModal">
            <div class="puzzle-box">
                <h2>ต่อภาพจิ๊กซอว์ให้สมบูรณ์</h2>
                <p style="font-size: 0.8rem; color: #666; margin-bottom: 10px;">คลิกที่ชิ้นส่วนเพื่อสลับตำแหน่ง</p>
                <div class="puzzle-grid" id="puzzleGrid">
                    <!-- ชิ้นส่วนจิ๊กซอว์ -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let score = 0;
        const targetScore = 20;
        const waterSection = document.getElementById('waterSection');
        const scoreText = document.getElementById('scoreText');
        const uiHeader = document.getElementById('uiHeader');
        const giantContainer = document.getElementById('giantContainer');
        const questionMark = document.getElementById('questionMark');
        const couplePhoto = document.getElementById('couplePhoto');
        const puzzleModal = document.getElementById('puzzleModal');
        const wishBox = document.getElementById('wishBox');
        const typedText = document.getElementById('typedText');

        let spawnInterval;

        // 1. ฟังก์ชันสร้างกระทงลอยมาให้เก็บ
        function spawnKrathong() {
            if (score >= targetScore) return;

            const krathong = document.createElement('div');
            krathong.classList.add('floating-krathong');
            
            // สุ่มตำแหน่งแนวนอน
            const randomX = Math.random() * (waterSection.clientWidth - 70);
            krathong.style.left = randomX + 'px';
            krathong.style.bottom = '-80px';

            waterSection.appendChild(krathong);

            // การเคลื่อนที่ขึ้นด้านบน
            let currentBottom = -80;
            const speed = 1.5 + Math.random() * 1.5;
            
            const moveInterval = setInterval(() => {
                currentBottom += speed;
                krathong.style.bottom = currentBottom + 'px';

                // ถ้ารอยพ้นขอบบนของพื้นที่น้ำให้ลบออก
                if (currentBottom > waterSection.clientHeight + 50) {
                    clearInterval(moveInterval);
                    krathong.remove();
                }
            }, 30);

            // เมื่อคลิกเก็บกระทง
            krathong.addEventListener('click', (e) => {
                e.stopPropagation();
                score++;
                scoreText.innerText = `เก็บกระทง: ${score} / ${targetScore}`;
                clearInterval(moveInterval);
                krathong.remove();

                // ตรวจสอบว่าครบ 20 ชิ้นหรือยัง
                if (score >= targetScore) {
                    endMinigame();
                }
            });
        }

        // เริ่มต้นสร้างกระทงเรื่อยๆ
        spawnInterval = setInterval(spawnKrathong, 800);

        // เมื่อเก็บครบ 20 ชิ้น
        function endMinigame() {
            clearInterval(spawnInterval);
            // ลบกระทงเล็กที่เหลืออยู่ทั้งหมด
            document.querySelectorAll('.floating-krathong').forEach(k => k.remove());
            uiHeader.style.display = 'none';
            
            // แสดงกระทงใหญ่
            giantContainer.style.display = 'block';
        }

        // 2. เมื่อกดที่เครื่องหมายคำถาม เปิดเกมจิ๊กซอว์
        questionMark.addEventListener('click', () => {
            puzzleModal.style.display = 'flex';
            initPuzzle();
        });

        // ระบบจิ๊กซอว์ 3x3
        let puzzlePieces = [0, 1, 2, 3, 4, 5, 6, 7, 8];
        let currentOrder = [...puzzlePieces];
        let selectedIndex = null;

        function initProvider() {
            // สุ่มสลับตำแหน่ง
            do {
                currentOrder.sort(() => Math.random() - 0.5);
            } while (isSorted(currentOrder)); // ป้องกันสุ่มแล้วถูกตั้งแต่แรก
            renderPuzzle();
        }

        function isSorted(arr) {
            return arr.every((val, i) => val === puzzlePieces[i]);
        }

        function initPuzzle() {
            currentOrder = [...puzzlePieces];
            currentOrder.sort(() => Math.random() - 0.5);
            renderPuzzle();
        }

        function renderPuzzle() {
            const grid = document.getElementById('puzzleGrid');
            grid.innerHTML = '';

            currentOrder.forEach((pieceIndex, currentIndex) => {
                const piece = document.createElement('div');
                piece.classList.add('puzzle-piece');
                
                // คำนวณตำแหน่ง Background-image เพื่อตัดรูปให้ตรงกับชิ้นส่วน
                const x = (pieceIndex % 3) * 90;
                const y = Math.floor(pieceIndex / 3) * 90;
                piece.style.backgroundPosition = `-${x}px -${y}px`;

                piece.addEventListener('click', () => {
                    if (selectedIndex === null) {
                        selectedIndex = currentIndex;
                        piece.style.border = '2px solid #ffcc00';
                    } else {
                        // สลับตำแหน่งชิ้นส่วน
                        let temp = currentOrder[selectedIndex];
                        currentOrder[selectedIndex] = currentOrder[currentIndex];
                        currentOrder[currentIndex] = temp;
                        selectedIndex = null;
                        renderPuzzle();

                        // ตรวจสอบว่าเรียงถูกต้องครบหรือยัง
                        if (isSorted(currentOrder)) {
                            setTimeout(() => {
                                puzzleModal.style.display = 'none';
                                // ซ่อนเครื่องหมายคำถาม แสดงรูปคู่
                                questionMark.style.display = 'none';
                                couplePhoto.style.display = 'block';
                            }, 300);
                        }
                    }
                });

                grid.appendChild(piece);
            });
        }

        // 3. เมื่อกดที่รูปคู่ แสดงข้อความอธิษฐานพิมพ์ทีละตัวอักษร
        const wishMessage = "สุขสันต์วันลอยกระทงนะคับคนดี ขอให้คำอธิษฐานในกระทงนี้ นำพาความสุข ความรัก และสิ่งดีๆ มาให้เราอยู่ด้วยกันแบบนี้ไปนานๆ รักเธอนะคะ ❤️";
        let isTypingStarted = false;

        couplePhoto.addEventListener('click', () => {
            if (isTypingStarted) return;
            isTypingStarted = true;
            wishBox.style.display = 'block';
            typeWriter(wishMessage, 0);
        });

        function typeWriter(text, i) {
            if (i < text.length) {
                typedText.innerHTML += text.charAt(i);
                setTimeout(() => typeWriter(text, i + 1), 70);
            }
        }
    </script>
</body>
</html>
